name: ETL SRAG Semanal

on:
  schedule:
    - cron: '0 1 * * 6'      # sábado 01h UTC = sexta 22h BRT
  workflow_dispatch:          # acionamento manual pelo GitHub
  repository_dispatch:        # acionamento via POST /api/etl/trigger
    types: [run-etl]

permissions:
  contents: read

concurrency:
  group: siveplens-etl
  cancel-in-progress: false

jobs:
  etl:
    if: vars.ENABLE_ETL == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: etl-python/requirements.txt

      - name: Instalar dependências
        run: pip install -r etl-python/requirements.txt

      - name: Executar ETL CSV
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python etl-python/update_csv.py

      - name: Notificar falha
        if: failure()
        run: echo "ETL falhou — verificar logs acima e tabela controle_carga"
